spring:
  application:
    name: bookify

  datasource:
    url: jdbc:postgresql://localhost:5432/bookify
    username: bookify_user
    password: bookify_pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true